<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Painel do treino</title>
<!--
  PAINEL DO TREINO — desde 13/11/2026 (pedido do Marlen).

  Pagina solta, sem o motor do app: so desenha. Quem decide e o servidor:
  esta pagina entrega o codigo e o servidor responde so para a Diretoria e a
  supervisao (painelTreino, em src/Codigo.gs). Aqui nao mora nome de pessoa,
  dado de loja, regra nem codigo: tudo desce depois do codigo validado.

  Usa o mesmo codigo que o app ja guarda no aparelho (rdo_codigo), entao quem
  ja entrou no app como Diretoria abre o painel direto.
-->
<style>
  :root {
    --azul: #02306E; --laranja: #E06E0A; --verde: #1E9E5A; --vermelho: #C0392B; --amarelo: #E8B027;
    --tinta: #1B2430; --cinza: #5F6772; --linha: #DDE1E6;
  }
  html { background: #fff; }
  body { margin: 0 auto; max-width: 720px; padding: 20px 16px 56px; color: var(--tinta); background: #fff;
    font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0; color: var(--azul); font-weight: 800; }
  h2 { font-size: 22px; margin: 28px 0 4px; color: var(--azul); font-weight: 800; }
  .sub { color: var(--cinza); font-size: 15px; margin: 4px 0 0; }
  .topo { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  button { font: inherit; font-weight: 800; min-height: 48px; padding: 10px 18px; border-radius: 12px;
    border: 2px solid var(--azul); background: var(--azul); color: #fff; }
  button.leve { background: #fff; color: var(--azul); }
  input { font: inherit; width: 100%; box-sizing: border-box; min-height: 52px; padding: 10px 14px;
    border-radius: 12px; border: 2px solid var(--linha); margin: 8px 0 12px; }
  .resumo { font-size: 16px; color: var(--cinza); margin: 0 0 10px; }
  .vazia { border: 2px dashed var(--linha); border-radius: 12px; padding: 14px 16px; color: var(--cinza); }
  .pessoa { border: 2px solid var(--linha); border-left-width: 10px; border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
  .pessoa .nome { font-size: 20px; font-weight: 800; line-height: 1.25; }
  .pessoa .papel { font-size: 14px; color: var(--cinza); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .selo { display: inline-block; font-size: 14px; font-weight: 800; padding: 2px 10px; border-radius: 999px; margin-top: 6px; color: #fff; }
  .dados { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-top: 10px; font-size: 16px; }
  .dados b { display: block; font-size: 13px; color: var(--cinza); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
  .f-em_dia      { border-left-color: var(--verde); }    .s-em_dia      { background: var(--verde); }
  .f-lembrete    { border-left-color: var(--amarelo); }  .s-lembrete    { background: #8A6400; }
  .f-conversa    { border-left-color: var(--laranja); }  .s-conversa    { background: var(--laranja); }
  .f-advertencia { border-left-color: var(--vermelho); } .s-advertencia { background: var(--vermelho); }
  .f-diretoria   { border-left-color: #6E1A12; }         .s-diretoria   { background: #6E1A12; }
  .f-nunca       { border-left-color: #4A4F57; }         .s-nunca       { background: #4A4F57; }
  .aviso { border-left: 8px solid var(--amarelo); background: #FFF6DC; border-radius: 10px; padding: 12px 14px; margin: 16px 0; }
  .erro { border-left: 8px solid var(--vermelho); background: #FBECEA; border-radius: 10px; padding: 12px 14px; margin: 16px 0; }
  .regua { font-size: 15px; color: var(--cinza); margin-top: 32px; border-top: 2px solid var(--linha); padding-top: 14px; }
  .regua li { margin: 4px 0; }
  /* Resumo no alto: uma barra por loja, dividida pela faixa de cada pessoa. */
  .barras { margin: 18px 0 6px; }
  .linha { display: block; width: 100%; text-align: left; background: #fff; color: var(--tinta); border: 0;
    border-bottom: 2px solid var(--linha); border-radius: 0; padding: 12px 0; min-height: 0; font-weight: 400; }
  .linha .cab { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .linha .cab b { font-size: 18px; font-weight: 800; color: var(--azul); }
  .linha .cab span { font-size: 15px; color: var(--cinza); white-space: nowrap; }
  .barra { display: flex; height: 22px; border-radius: 8px; overflow: hidden; margin-top: 8px; background: #EDEFF2; }
  .barra.sem { background: none; border: 2px dashed var(--linha); height: 18px; }
  .seg { height: 100%; }
  .legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--cinza); margin: 10px 0 0; }
  .legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .oculto { display: none; }
  /* Trilha do treinamento (desde 14/11/2026) */
  .tr-lista { margin: 6px 0 16px; }
  .tr-pessoa { border: 2px solid var(--linha); border-left-width: 10px; border-radius: 12px; padding: 10px 14px; margin: 8px 0; }
  .tr-parada { border-left-color: var(--laranja); } .tr-pessoa-esp { border-left-color: var(--amarelo); }
  .tr-diretoria { border-left-color: #6E1A12; } .tr-em_dia { border-left-color: var(--verde); }
  .tr-ficha { margin-top: 8px; font-size: 16px; }
  .tr-ficha div { margin: 3px 0; }
  .tr-notas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tr-notas input { margin: 0; }
  select { font: inherit; width: 100%; min-height: 52px; border-radius: 12px; border: 2px solid var(--linha); padding: 8px 10px; margin: 8px 0; background: #fff; }
</style>
</head>
<body>

<div class="topo">
  <div>
    <h1>Painel do treino</h1>
    <p class="sub" id="quando">Carregando…</p>
  </div>
  <button class="leve oculto" id="atualizar">Atualizar</button>
</div>
<p style="margin:12px 0 0"><a href="./" style="color:#02306E;font-weight:800;font-size:17px">← Voltar ao app</a></p>

<div id="entrada" class="oculto">
  <div class="aviso">Este painel é da Diretoria, da supervisão e da gerência. Digite o seu código do app.</div>
  <form id="formulario">
    <input id="codigo" type="password" inputmode="numeric" autocomplete="off" placeholder="Seu código">
    <button type="submit">Entrar</button>
  </form>
</div>

<div id="mensagem"></div>
<!-- A Trilha vem no alto: no fim, depois de todas as lojas, ninguem a achava (Marlen, 14/11/2026). -->
<div id="trilha"></div>
<div id="lojas"></div>

<div class="regua oculto" id="regua"></div>

<script>
(function () {
  'use strict';
  var URL_SERVIDOR = 'https://script.google.com/macros/s/AKfycbw8TGcUb7K76IvyTI3DNCwneXfj4jSt9_838rnR9CnbhLtW3XQQ8ITiP6liBdQEEOLeuw/exec';

  var ROTULO = {
    em_dia: 'Em dia', lembrete: 'Lembrete', conversa: 'Conversa',
    advertencia: 'Advertência', diretoria: 'Decisão da Diretoria', nunca: 'Nunca treinou'
  };
  var ERROS = {
    sem_permissao: 'Este código não é da Diretoria, da supervisão nem da gerência. O painel não abre para ele.',
    codigo_invalido: 'Código não reconhecido. Confira e tente de novo.',
    sem_codigo: 'Digite o seu código.',
    muitas_tentativas: 'Muitas tentativas erradas. Espere alguns minutos e tente de novo.',
    codigo_duplicado: 'Este código está repetido na planilha. Avise a Diretoria.',
    sem_conexao: 'Sem conexão com o servidor. Confira a internet e toque em Atualizar.',
    resposta_invalida: 'O servidor respondeu algo inesperado. Tente de novo em alguns segundos.'
  };

  function id(x) { return document.getElementById(x); }
  function guardado(chave) { try { return window.localStorage.getItem(chave) || ''; } catch (e) { return ''; } }
  function guardar(chave, valor) {
    try { if (valor) window.localStorage.setItem(chave, valor); else window.localStorage.removeItem(chave); } catch (e) {}
  }
  function aparelho() {
    var a = guardado('rdo_aparelho');
    if (!a) { a = 'ap' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); guardar('rdo_aparelho', a); }
    return a;
  }
  // Texto vindo do servidor entra sempre como texto, nunca como marcacao.
  function el(tag, classe, texto) {
    var n = document.createElement(tag);
    if (classe) n.className = classe;
    if (texto !== undefined && texto !== null) n.textContent = texto;
    return n;
  }

  function chamar(codigo, pronto) {
    fetch(URL_SERVIDOR, {
      method: 'POST',
      // text/plain de proposito: com application/json o navegador faz uma
      // checagem previa que o Apps Script nao responde (igual ao app).
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: 'painelTreino', args: [codigo, aparelho()] })
    })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var d = null;
        try { d = JSON.parse(t); } catch (e) {}
        pronto(d || { ok: false, erro: 'resposta_invalida' });
      })
      .catch(function () { pronto({ ok: false, erro: 'sem_conexao' }); });
  }

  function tempo(seg) {
    if (seg === null || seg === undefined) return 'sem registro';
    var m = Math.floor(seg / 60), s = seg % 60;
    return (m ? m + ' min ' : '') + s + ' s';
  }
  function nota(p) {
    if (p.nota7 === null || p.nota7 === undefined) return 'sem registro';
    var t = p.nota7 + '%';
    if (p.notaAntes !== null && p.notaAntes !== undefined) {
      var dif = p.nota7 - p.notaAntes;
      t += dif > 0 ? ' (subiu ' + dif + ')' : (dif < 0 ? ' (caiu ' + (-dif) + ')' : ' (igual)');
    }
    return t;
  }
  function parado(p) {
    if (p.faixa === 'nunca') return 'nunca treinou';
    if (!p.semTreino) return 'nenhum dia';
    return p.semTreino + (p.semTreino === 1 ? ' dia útil' : ' dias úteis');
  }
  function dado(rotulo, valor) {
    var d = el('div');
    d.appendChild(el('b', '', rotulo));
    d.appendChild(document.createTextNode(valor));
    return d;
  }

  function desenhar(r) {
    id('quando').textContent = 'Atualizado em ' + r.geradoEm + ' · semana = últimos 7 dias';
    var raiz = id('lojas');
    raiz.textContent = '';

    // Resumo: uma barra por loja, uma cor por faixa. Tocar leva aos cartoes da loja.
    var ORDEM = ['em_dia', 'lembrete', 'conversa', 'advertencia', 'diretoria', 'nunca'];
    var COR = { em_dia: '#1E9E5A', lembrete: '#E8B027', conversa: '#E06E0A',
                advertencia: '#C0392B', diretoria: '#6E1A12', nunca: '#4A4F57' };
    var barras = el('div', 'barras');
    (r.lojas || []).forEach(function (lj, k) {
      var b = el('button', 'linha');
      b.type = 'button';
      var cab = el('div', 'cab');
      cab.appendChild(el('b', '', lj.nome));
      cab.appendChild(el('span', '', lj.pessoas.length ? (lj.treinaram7 + ' de ' + lj.ativos + ' treinando') : 'ninguém cadastrado'));
      b.appendChild(cab);
      var barra = el('div', lj.pessoas.length ? 'barra' : 'barra sem');
      ORDEM.forEach(function (f) {
        var n = lj.pessoas.filter(function (p) { return p.faixa === f; }).length;
        if (!n) return;
        var s = el('div', 'seg');
        s.style.width = (100 * n / lj.pessoas.length) + '%';
        s.style.background = COR[f];
        s.title = n + ' · ' + (ROTULO[f] || f);
        barra.appendChild(s);
      });
      b.appendChild(barra);
      b.addEventListener('click', function () {
        var alvo = id('loja-' + k);
        if (alvo && alvo.scrollIntoView) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      barras.appendChild(b);
    });
    var leg = el('div', 'legenda');
    ORDEM.forEach(function (f) {
      var item = el('span');
      var q = el('i'); q.style.background = COR[f];
      item.appendChild(q);
      item.appendChild(document.createTextNode(ROTULO[f] || f));
      leg.appendChild(item);
    });
    barras.appendChild(leg);
    raiz.appendChild(barras);

    (r.lojas || []).forEach(function (lj, k) {
      var titulo = el('h2', '', lj.nome);
      titulo.id = 'loja-' + k;
      raiz.appendChild(titulo);
      if (!lj.pessoas.length) {
        raiz.appendChild(el('div', 'vazia', 'Ninguém cadastrado nesta loja dentro do app.'));
        return;
      }
      raiz.appendChild(el('p', 'resumo', lj.treinaram7 + ' de ' + lj.ativos + ' treinaram na semana'));
      lj.pessoas.forEach(function (p) {
        var c = el('div', 'pessoa f-' + p.faixa);
        c.appendChild(el('div', 'papel', p.papel));
        c.appendChild(el('div', 'nome', p.nome));
        c.appendChild(el('span', 'selo s-' + p.faixa, ROTULO[p.faixa] || p.faixa));
        var g = el('div', 'dados');
        g.appendChild(dado('Dias com treino na semana', String(p.dias7)));
        g.appendChild(dado('Rodadas na semana', String(p.rodadas7)));
        g.appendChild(dado('Último treino', p.ultimo || 'nunca'));
        g.appendChild(dado('Parada há', parado(p)));
        g.appendChild(dado('Nota da semana', nota(p)));
        g.appendChild(dado('Tempo médio da rodada', tempo(p.segundos7)));
        c.appendChild(g);
        raiz.appendChild(c);
      });
    });
    var rg = r.regua || {};
    var caixa = id('regua');
    caixa.textContent = '';
    caixa.appendChild(el('div', '', 'Régua de dias úteis sem treino:'));
    var ul = el('ul');
    [[rg.lembrete, 'lembrete na tela da própria pessoa'], [rg.conversa, 'conversa, com registro'],
     [rg.advertencia, 'advertência por escrito'], [rg.diretoria, 'sobe para a Diretoria decidir']]
      .forEach(function (x) { ul.appendChild(el('li', '', x[0] + ' dias: ' + x[1])); });
    caixa.appendChild(ul);
    caixa.appendChild(el('div', '', 'A nota e o tempo só aparecem nas rodadas feitas depois que a gravação foi ligada. Números provisórios, não auditados.'));
    caixa.className = 'regua';
    id('atualizar').className = 'leve';
  }

  // ------------------------------------------------------------
  // Trilha do treinamento (desde 14/11/2026). O servidor decide quem ve quem
  // (painelTrilha): a gerente so a propria loja. Sem ninguem para ver e sem
  // poder matricular, esta parte nao aparece e o Painel fica como era.
  // ------------------------------------------------------------
  function chamarFn(fn, codigo, extra, pronto) {
    var args = [codigo, aparelho()];
    if (extra !== undefined) args.push(extra);
    fetch(URL_SERVIDOR, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.text(); })
      .then(function (t) { var d = null; try { d = JSON.parse(t); } catch (e) {} pronto(d || { ok: false, erro: 'resposta_invalida' }); })
      .catch(function () { pronto({ ok: false, erro: 'sem_conexao' }); });
  }
  var ERROS_TRILHA = {
    sem_permissao: 'Este código não pode fazer isso.', passo_fora_de_hora: 'Este passo não é o da vez desta pessoa.',
    notas_invalidas: 'Preencha as 6 notas, de 0 a 10.', nao_lanca_o_proprio: 'Ninguém lança o próprio resultado.',
    loja_em_piloto: 'Loja em piloto: a trilha não entra nela por enquanto.', so_diretoria: 'Quem aguarda a Diretoria só sai da trilha pela Diretoria.', fase_b_nao_construida: 'Vendedora nova ainda não entra: a parte dos Primeiros dias não está pronta no app.',
    pessoa_nao_encontrada: 'Pessoa não encontrada ou inativa.', nao_aguarda_diretoria: 'Esta pessoa não está aguardando a Diretoria.'
  };
  var LISTAS = [['parada', 'Parada', 'tr-parada'], ['pessoa', 'Esperando uma pessoa', 'tr-pessoa-esp'],
                ['diretoria', 'Aguarda a Diretoria', 'tr-diretoria'], ['em_dia', 'Em dia', 'tr-em_dia']];

  function carregarTrilha(codigo) {
    chamarFn('painelTrilha', codigo, undefined, function (r) {
      var box = id('trilha');
      box.textContent = '';
      if (!r || !r.ok || !Array.isArray(r.pessoas)) return; // servidor antigo ou sem permissao: o Painel continua como era
      if (!r.pessoas.length && !(r.podeMatricular && r.candidatas.length)) return;
      desenharTrilha(box, r, codigo);
    });
  }

  function acaoTrilha(fn, codigo, extra, aviso) {
    if (aviso && !window.confirm(aviso)) return;
    chamarFn(fn, codigo, extra, function (r) {
      if (!r || !r.ok) { window.alert(ERROS_TRILHA[(r && r.erro) || ''] || 'Não deu certo. Tente de novo.'); return; }
      carregarTrilha(codigo);
    });
  }

  function desenharTrilha(box, r, codigo) {
    box.appendChild(el('h2', '', 'Trilha do treinamento'));
    box.appendChild(el('p', 'resumo', 'Só quem está matriculada na trilha. Toque no nome para abrir a ficha.'));
    LISTAS.forEach(function (L) {
      var doGrupo = r.pessoas.filter(function (p) { return p.lista === L[0]; });
      if (!doGrupo.length) return;
      box.appendChild(el('h2', '', L[1] + ' (' + doGrupo.length + ')'));
      var lista = el('div', 'tr-lista');
      doGrupo.forEach(function (p) { lista.appendChild(cartaoTrilha(p, L[2], codigo, r.podeMatricular)); });
      box.appendChild(lista);
    });
    if (r.podeMatricular && r.candidatas.length) {
      box.appendChild(el('h2', '', 'Matricular na trilha'));
      box.appendChild(el('p', 'resumo', 'Só vendedora que já trabalha na loja. Lojas do piloto não aparecem.'));
      var sel = el('select');
      r.candidatas.forEach(function (c, i) { var o = el('option', '', c.loja + ' · ' + c.nome); o.value = String(i); sel.appendChild(o); });
      box.appendChild(sel);
      var b = el('button', '', 'Matricular');
      b.type = 'button';
      b.addEventListener('click', function () {
        var c = r.candidatas[Number(sel.value)];
        acaoTrilha('matricular', codigo, { loja: c.loja, nome: c.nome, tipo: 'ja_trabalha' },
          'Matricular ' + c.nome + ' (' + c.loja + ') na trilha? Ela passa a ver "Minha trilha" ao entrar no app.');
      });
      box.appendChild(b);
    }
  }

  function cartaoTrilha(p, classe, codigo, podeMatricular) {
    var c = el('div', 'tr-pessoa ' + classe);
    var cab = el('button', 'linha');
    cab.type = 'button';
    var linha1 = el('div', 'cab');
    linha1.appendChild(el('b', '', p.nome));
    linha1.appendChild(el('span', '', p.loja));
    cab.appendChild(linha1);
    var onde = p.concluida ? 'Etapa 1 concluída' : (p.atual.fase + ' · passo ' + p.atual.n + ' de ' + p.totalJornada + ' · ' + p.atual.titulo);
    cab.appendChild(el('div', 'resumo', onde));
    if (p.motivo) cab.appendChild(el('div', 'resumo', p.motivo));
    c.appendChild(cab);
    var f = el('div', 'tr-ficha oculto');
    f.appendChild(el('div', '', 'Começou em ' + p.desde + ' · ' + (p.tipo === 'ja_trabalha' ? 'já trabalhava na loja' : 'vendedora nova')));
    f.appendChild(el('div', '', 'Última atividade: ' + (p.ultima || 'nenhuma') + (p.parada !== null && p.parada !== undefined ? ' · ' + p.parada + ' dias úteis' : '')));
    f.appendChild(el('div', '', 'Aulas fechadas: ' + p.aulasFeitas + ' de ' + p.aulasTotal + ' · vídeos: ' + p.videosFeitos + ' de ' + p.videosTotal));
    var t = (p.prova.tentativas || []).filter(function (x) { return x.estado === 'corrigida'; });
    f.appendChild(el('div', '', 'Prova Final: ' + (t.length ? t.map(function (x) {
      return x.n + 'ª ' + x.acertos + ' de ' + x.questoes + ' (' + x.data + (x.minutos !== null ? ', ' + x.minutos + ' min' : '') + ')';
    }).join(' · ') + (p.prova.estado === 'aprovada' ? ' · aprovada' : '') : 'ainda não fez')));
    if (p.simulacoes.length) f.appendChild(el('div', '', '6 simulações: ' + p.simulacoes.map(function (s) {
      return s.data + ' ' + (s.resultado === 'aprovada' ? 'aprovada' : 'refazer') + ' (' + String(s.notas).split(';').join(', ') + ')';
    }).join(' · ')));
    if (p.podeLancar && p.atual.id === 'ponte') {
      var bp = el('button', '', 'Lançar: Ponte feita');
      bp.type = 'button';
      bp.addEventListener('click', function () { acaoTrilha('lancarPassoPessoa', codigo, { loja: p.loja, nome: p.nome, passo: 'ponte' }, 'Confirmar que a conversa da Ponte com ' + p.nome + ' foi feita?'); });
      f.appendChild(bp);
    }
    if (p.podeLancar && p.atual.id === 'simulacoes') {
      f.appendChild(el('div', '', 'Notas das 6 simulações (0 a 10; passa com 8 em cada):'));
      var g = el('div', 'tr-notas'), ins = [];
      for (var i = 0; i < 6; i++) { var inp = el('input'); inp.type = 'number'; inp.min = '0'; inp.max = '10'; inp.inputMode = 'numeric'; inp.placeholder = String(i + 1); ins.push(inp); g.appendChild(inp); }
      f.appendChild(g);
      var bs = el('button', '', 'Lançar as 6 simulações');
      bs.type = 'button';
      bs.addEventListener('click', function () {
        var notas = ins.map(function (x) { return x.value === '' ? NaN : Number(x.value); });
        acaoTrilha('lancarPassoPessoa', codigo, { loja: p.loja, nome: p.nome, passo: 'simulacoes', notas: notas },
          'Lançar as notas ' + notas.join(', ') + ' para ' + p.nome + '?');
      });
      f.appendChild(bs);
    }
    if (p.podeLiberar) {
      var bl = el('button', 'leve', 'Liberar nova série da Prova Final');
      bl.type = 'button';
      bl.addEventListener('click', function () { acaoTrilha('liberarNovaSerie', codigo, { loja: p.loja, nome: p.nome }, 'Liberar uma nova série para ' + p.nome + '? Ela refaz as aulas da Trilha antes.'); });
      f.appendChild(bl);
    }
    if (podeMatricular && p.podeTirar !== false) {
      var bd = el('button', 'leve', 'Tirar da trilha');
      bd.type = 'button';
      bd.addEventListener('click', function () { acaoTrilha('desmatricular', codigo, { loja: p.loja, nome: p.nome }, 'Tirar ' + p.nome + ' da trilha? Ela volta a ver o app como antes. O que já fez continua gravado.'); });
      f.appendChild(bd);
    }
    c.appendChild(f);
    cab.addEventListener('click', function () { f.className = f.className.indexOf('oculto') > -1 ? 'tr-ficha' : 'tr-ficha oculto'; });
    return c;
  }

  function mostrarErro(codigoErro) {
    var m = id('mensagem');
    m.textContent = '';
    m.appendChild(el('div', 'erro', ERROS[codigoErro] || 'Algo deu errado. Tente de novo em alguns segundos.'));
  }

  function carregar(codigo, veioDoFormulario) {
    id('mensagem').textContent = '';
    id('quando').textContent = 'Carregando…';
    // Treino e trilha pedidos ao mesmo tempo (antes, a trilha esperava o treino chegar).
    carregarTrilha(codigo);
    chamar(codigo, function (r) {
      if (r && r.ok) {
        if (veioDoFormulario) guardar('rdo_codigo', codigo);
        id('entrada').className = 'oculto';
        desenhar(r);
        return;
      }
      id('quando').textContent = '';
      var erro = (r && r.erro) || 'resposta_invalida';
      mostrarErro(erro);
      if (erro !== 'sem_conexao' && erro !== 'resposta_invalida') id('entrada').className = '';
    });
  }

  id('formulario').addEventListener('submit', function (e) {
    e.preventDefault();
    var c = String(id('codigo').value || '').replace(/\D/g, '');
    id('codigo').value = '';
    if (!c) return mostrarErro('sem_codigo');
    carregar(c, true);
  });
  id('atualizar').addEventListener('click', function () { carregar(guardado('rdo_codigo'), false); });

  var salvo = guardado('rdo_codigo');
  if (salvo) carregar(salvo, false);
  else { id('quando').textContent = ''; id('entrada').className = ''; }
})();
</script>
</body>
</html>
